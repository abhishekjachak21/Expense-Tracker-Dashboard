services:
  postgres:
    image: postgres:17
    container_name: expense-tracker-postgres
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - expense_tracker_pgdata:/var/lib/postgresql/data

volumes:
  expense_tracker_pgdata:
